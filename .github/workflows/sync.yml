name: Fast Sync FMHY Blocklists & NextDNS

on:
  schedule:
    # Runs every 30 minutes for fast sync
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: sync (add new domains) or remove (remove FMHY domains)'
        required: false
        default: 'sync'
        type: choice
        options:
          - sync
          - remove
      categories:
        description: 'Categories to sync or remove (e.g. streaming, gaming, or all)'
        required: false
        default: 'streaming'
        type: string
      profiles:
        description: 'Override Profile IDs (comma-separated). Leave empty to use repo secret'
        required: false
        default: ''
        type: string

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install requests

      - name: Run Multi-Category Generator (Accumulative)
        run: python build_lists.py

      - name: Commit and Push Changes (If Modified)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-refresh blocklists [skip ci]"
            git push
          else
            echo "No upstream changes detected across categories."
          fi

      - name: Sync to NextDNS Profiles (Cloud Denylist)
        env:
          NEXTDNS_API_KEY: ${{ secrets.NEXTDNS_API_KEY }}
          NEXTDNS_PROFILES: ${{ github.event.inputs.profiles || secrets.NEXTDNS_PROFILES }}
          NEXTDNS_CATEGORIES: ${{ github.event.inputs.categories || vars.NEXTDNS_CATEGORIES || 'streaming' }}
          NEXTDNS_ACTION: ${{ github.event.inputs.action || 'sync' }}
        run: |
          if [ -z "$NEXTDNS_API_KEY" ] || [ -z "$NEXTDNS_PROFILES" ]; then
            echo "[INFO] NEXTDNS_API_KEY or NEXTDNS_PROFILES secret not configured."
            echo "[INFO] Skipping NextDNS cloud sync. (Add them in GitHub Repo Settings -> Secrets to enable)."
            exit 0
          fi
          python -u sync_nextdns.py
