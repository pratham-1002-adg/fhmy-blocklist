name: Fast Sync FMHY Blocklists

on:
  schedule:
    # Runs every 15 minutes (fastest reliable interval before runner queue throttling)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install requests

      - name: Run Multi-Category Generator
        run: python build_lists.py

      - name: Commit and Push Changes (If Modified)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lists/ README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-refresh blocklists [skip ci]"
            git push
          else
            echo "No upstream changes detected across categories."
          fi
